# Settings the HTCondor API server reads.
#
# This file is the source. knobs_gen.go is generated from it by
# `make knobs`, and a setting the server reads has to be here, because
# config.Get only accepts a declared knob -- there is no way to spell a
# name that this file does not carry.
#
# Fields:
#   name     the configuration parameter, HTTP_API_*
#   type     string | bool | int | duration | bytes | list | words
#   default  what applies when the setting is absent
#   scope    startup (a change needs a restart) | reconfig (a
#            reconfigure installs it on the running server)
#   doc      one paragraph, written for an operator; this is what the
#            configuration reference prints
#   obsolete optional; marks a setting that still works but should not
#            be used. It is left out of the reference entirely, and the
#            generated declaration is marked Deprecated so staticcheck
#            reports every read. superseded_by names its replacement.
#   default_doc optional; what the reference prints instead of the
#            literal default, for a setting whose "unset" behaviour is
#            not a value this table holds. A whole sentence.
#   see      optional cross-references, each a text and a url relative
#            to docs/operator/config.md; the reference prints them as
#            links and the documentation tests check they resolve
#
# Migration in progress: most settings are still read as strings
# elsewhere. See design_notes/DOCUMENTATION_SITE.md.

knobs:
  - name: HTTP_API_TLS_CERT
    type: string
    default: ""
    scope: startup
    doc: >
      PEM certificate for serving HTTPS directly, rather than behind a
      terminating proxy. Needs HTTP_API_TLS_KEY; neither alone enables
      TLS.

  - name: HTTP_API_TLS_KEY
    type: string
    default: ""
    scope: startup
    doc: >
      Private key for HTTP_API_TLS_CERT. Keep it readable only by the
      account the server runs as.

  - name: HTTP_API_TLS_CA_CERT
    type: string
    default: ""
    scope: startup
    doc: >
      CA bundle used to verify client certificates. Unset asks for no
      client certificate.

  - name: HTTP_API_READ_TIMEOUT
    type: duration
    default: 30s
    scope: startup
    doc: >
      How long a request may take to arrive in full, as a Go duration.
      A value that cannot be parsed is logged and the default applies.

  - name: HTTP_API_WRITE_TIMEOUT
    type: duration
    default: 30s
    scope: startup
    doc: >
      How long a response may take to write, as a Go duration. This
      bounds a slow client, so it also bounds a deliberately long poll;
      see the note on streaming endpoints before lowering it.

  - name: HTTP_API_IDLE_TIMEOUT
    type: duration
    default: 120s
    scope: startup
    doc: >
      How long a keep-alive connection may sit idle before the server
      closes it, as a Go duration.

  - name: HTTP_API_OAUTH2_ISSUER
    type: string
    default: ""
    scope: startup
    doc: >
      The issuer this server names in its own OAuth2 documents. Unset,
      it is derived from the externally-visible URL, assuming https.

  - name: HTTP_API_OAUTH2_IDP
    type: string
    default: ""
    scope: startup
    doc: >
      An external identity provider to sign users in through, as the
      base URL of its OIDC discovery document. Discovery supplies the
      authorization, token and userinfo endpoints; the explicit
      HTTP_API_OAUTH2_*_URL settings are the fallback when it fails,
      which is logged as a warning rather than refused.

  - name: HTTP_API_OAUTH2_CLIENT_ID
    type: string
    default: ""
    scope: startup
    doc: The client id this server registered with that identity provider.

  - name: HTTP_API_OAUTH2_CLIENT_SECRET_FILE
    type: string
    default: ""
    scope: startup
    secret: true
    doc: >
      File holding the client secret for that registration. Read as
      root where the ordinary read is denied, since a secret staged on
      an access point is usually root-owned and this daemon has dropped
      privilege by then. An unreadable file is a warning and no secret,
      not a refusal to start.

  - name: HTTP_API_OAUTH2_AUTH_URL
    type: string
    default: ""
    scope: startup
    doc: >
      The provider's authorization endpoint, used when discovery is not
      configured or did not answer.

  - name: HTTP_API_OAUTH2_TOKEN_URL
    type: string
    default: ""
    scope: startup
    doc: >
      The provider's token endpoint, used when discovery is not
      configured or did not answer.

  - name: HTTP_API_OAUTH2_USERINFO_URL
    type: string
    default: ""
    scope: startup
    doc: >
      The provider's userinfo endpoint, used when discovery is not
      configured or did not answer.

  - name: HTTP_API_OAUTH2_REDIRECT_URL
    type: string
    default: ""
    scope: startup
    doc: >
      Where the provider sends the user back to, which has to be a
      redirect URI registered with it. Unset, it is the issuer followed
      by this server's callback path, which is the right answer
      whenever the issuer is how users reach it:
      /mcp/oauth2/callback on a server whose only surface is MCP,
      /oauth2/callback everywhere else. Both paths are served wherever
      MCP is on, so an authorization started before an upgrade still
      lands; but what has to be registered at the provider is the URI
      this server sends, so a build that gains the web UI needs
      /oauth2/callback added there -- or this set, to keep sending the
      old one.

  - name: HTTP_API_OAUTH2_SCOPES
    type: words
    default: ""
    scope: startup
    doc: >
      Scopes requested at sign-in, space separated as RFC 6749 writes
      them, e.g. "openid profile email org.cilogon.userinfo". Unset
      uses the built-in defaults. Every scope has to be approved for
      this client at the provider: CILogon rejects an unapproved scope
      outright, where it used to ignore it silently, and that refusal
      fails every login. offline_access is added to whatever is set
      here unless HTTP_API_UPSTREAM_REFRESH is off; that one this
      server adds itself, so a refusal of it is absorbed rather than
      failing logins.

  - name: HTTP_API_OAUTH2_GROUPS_CLAIM
    type: string
    default: groups
    scope: startup
    doc: >
      Which claim in the token carries the user's groups, for the
      settings that gate access on group membership.

  - name: HTTP_API_OAUTH2_USERNAME_CLAIM
    type: string
    default: ""
    scope: startup
    doc: >
      Which claim names the account that owns the jobs, e.g. eppn,
      where the provider's subject is not it. Unset uses the subject.
    see:
      - text: Local identity mapping
        url: auth.md#local-identity-mapping

  - name: HTTP_API_OAUTH2_REQUIREMENTS
    type: string
    default: ""
    scope: startup
    doc: >
      Login policy as a ClassAd expression over the token's claims; a
      login proceeds only where it evaluates true. It is parsed at
      startup and a malformed one stops the server, rather than failing
      at somebody's first login.
    see:
      - text: Local identity mapping
        url: auth.md#local-identity-mapping

  - name: HTTP_API_OAUTH2_DB_PATH
    type: string
    default: ""
    scope: startup
    doc: >
      Deprecated and ignored. The application database is
      HTTP_API_DB_PATH; the legacy oauth.db schema conflicts with the
      unified migration, so setting this is reported and has no effect.


  - name: HTTP_API_SPOOL_BUFFER_DIR
    type: string
    default: ""
    scope: startup
    doc: >
      Where an archive dropped in the SSH gateway's /submit/, or posted
      to the REST upload endpoints, is buffered while it is unpacked.
      Unset holds it in memory instead, under a much smaller ceiling.


  - name: HTTP_API_LISTEN
    type: string
    default: ""
    scope: startup
    obsolete:
      superseded_by: HTTP_API_LISTEN_ADDR
    doc: >
      An older spelling of the listen address, honored when
      HTTP_API_LISTEN_ADDR is unset and reported as an alias when it is
      used. HTTP_API_LISTEN_ADDR wins where both are set.

  # The two cross-user MCP privileges. Obsolete, so they are declared
  # here -- the table is the only place a setting may be spelled -- and
  # left out of the reference on purpose.
  #
  # Deliberately without superseded_by. HTTP_API_WEBUI_ADMIN_GROUP and
  # HTTP_API_SUPERUSER_GROUP are where the equivalent power lives for a
  # browser or API caller (handlers_admin.go names them), but they do
  # not grant the mcp:admin, mcp:superuser, anyuser:read or
  # anyuser:write scopes: oauth2_sso.go grants each of those from these
  # two group sets and from nothing else. Pointing an operator at a
  # setting that would not restore what they had is worse than pointing
  # them nowhere.
  - name: HTTP_API_MCP_ADMIN_GROUP
    type: string
    default: ""
    scope: reconfig
    obsolete: {}
    doc: >
      Group(s) whose members may read every user's jobs through MCP.
      Read as a raw string and split downstream, so a change to how
      lists are parsed does not change who is privileged.

  - name: HTTP_API_MCP_SUPERUSER_GROUP
    type: string
    default: ""
    scope: reconfig
    obsolete: {}
    doc: >
      Group(s) whose members may change any user's jobs through MCP.
      Read as a raw string and split downstream, as above.


  - name: HTTP_API_ENABLE_IDP
    type: bool
    default: "false"
    scope: startup
    doc: >
      Run the built-in identity provider, so this server signs users in
      itself instead of sending them to an external one. Off by
      default. The provider shares the unified application database;
      the separate HTTP_API_IDP_DB_PATH it once had is no longer read.

  - name: HTTP_API_IDP_ISSUER
    type: string
    default: ""
    scope: startup
    doc: >
      The issuer the built-in identity provider names in its own
      documents. Unset derives it the same way HTTP_API_OAUTH2_ISSUER
      is derived, from the externally-visible URL. Read only when
      HTTP_API_ENABLE_IDP is on.

  - name: HTTP_API_IDP_ACCESS_TOKEN_LIFESPAN
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset issues access tokens that live one hour.
    doc: >
      How long an access token the built-in identity provider issues
      stays valid, as a Go duration. A value that is not a duration, or
      is not positive, refuses to start rather than being quietly
      ignored -- a token lifetime is not something to get wrong
      silently. Read only when HTTP_API_ENABLE_IDP is on.

  - name: HTTP_API_IDP_REFRESH_TOKEN_LIFESPAN
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset issues refresh tokens that live 30 days.
    doc: >
      How long a refresh token the built-in identity provider issues
      stays valid. It has to be at least the access token lifespan, or
      the provider refuses to start: a refresh token that dies first
      makes every refresh fail after the access token expires. Read
      only when HTTP_API_ENABLE_IDP is on, and refused the same way as
      above when it is not a positive duration.

  - name: HTTP_API_OAUTH2_ACCESS_TOKEN_LIFESPAN
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset issues access tokens that live one hour.
    doc: >
      How long an access token this server issues as an OAuth2
      authorization server stays valid, as a Go duration. Refused the
      same way as the identity provider's when it is not a positive
      duration.

  - name: HTTP_API_OAUTH2_REFRESH_TOKEN_LIFESPAN
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset issues refresh tokens that live 30 days.
    doc: >
      How long one refresh token this server issues stays valid. Every
      refresh resets it, which is why HTTP_API_OAUTH2_MAX_GRANT_LIFETIME
      exists: without a cap, a client that keeps refreshing keeps its
      grant forever.
    see:
      - text: Refresh-grant re-authorization
        url: auth.md#refresh-grant-re-authorization

  - name: HTTP_API_OAUTH2_MAX_GRANT_LIFETIME
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset lets a grant go 30 days unused.
    doc: >
      How long a grant may go unused before the user has to consent
      again. Measured from the grant's last use rather than from
      consent, so a client that refreshes inside the window keeps its
      grant indefinitely, which is what lets an unattended integration
      keep working; an abandoned grant still expires. What bounds a
      grant in active use is the revocation oracles, not this.
    see:
      - text: Refresh-grant re-authorization
        url: auth.md#refresh-grant-re-authorization

  - name: HTTP_API_TOKEN_RETENTION
    type: string
    default: ""
    scope: startup
    default_doc: Unset keeps dead token rows for 90 days.
    doc: >
      How long rows for dead OAuth2 tokens are kept before being swept,
      as a duration with a unit, or off (equivalently 0) to keep them
      forever. A bare number is refused rather than read as
      nanoseconds, which is what parsing "90" would otherwise mean and
      is never what anybody intends; so is anything else that does not
      parse, and the server refuses to start rather than sweeping on a
      figure nobody chose. Only rows that are already dead -- revoked
      or expired -- are ever removed, because a live grant is
      somebody's session whatever its age.

  - name: HTTP_API_USER_HEADER_TRUST_ANY
    type: bool
    default: "false"
    scope: startup
    doc: >
      Accept the user header from any source address. Written true, t,
      1, yes or on -- the last two are accepted here although HTCondor
      configuration does not take them generally, because this setting
      always has. For demonstration
      and testing only: with it on, anything that can reach this server
      can claim to be any user, so it undoes authentication rather than
      relaxing it. Off by default, and the server logs a warning for as
      long as it is on. Leave it off anywhere a real person has an
      account.


  # Container builds. All read once at startup; the sizes are MiB,
  # matching what the build_container tool argument takes.
  - name: HTTP_API_BUILD_REQUIREMENTS
    type: string
    default: ""
    scope: startup
    doc: >
      ClassAd expression selecting the slots a container build may run
      on, for a site where no schedd transform does it. A site picks its
      build machines by its own convention and the tool cannot guess
      it, so an unconfigured server submits an ordinary job and relies
      on the caller naming a destination.

  - name: HTTP_API_BUILD_EXTRA_SUBMIT
    type: string
    default: ""
    scope: startup
    doc: >
      Extra submit-file lines added to every container build job, for
      whatever else a site's build slots need.

  - name: HTTP_API_BUILD_STAGING_BASE
    type: string
    default: ""
    scope: startup
    doc: >
      Where built images are published when the caller gives a bare
      name. Unset means every call has to name its own destination. It
      may be a template: {user} expands to the authenticated caller and
      {initial} to the first letter of that name, so a per-user staging
      area can be written osdf:///chtc/staging/{initial}/{user}. A base
      with no placeholder is used verbatim.

  - name: HTTP_API_BUILD_DEFAULT_CPUS
    type: int
    default: "0"
    scope: startup
    default_doc: Unset requests 8 CPUs.
    doc: >
      CPUs a container build requests when the caller does not say. A
      value that is not a whole number, or is negative, is reported and
      ignored rather than refusing to start: the rest of the server has
      nothing to do with container builds, and a typo in a build
      setting should not take the API down.

  - name: HTTP_API_BUILD_DEFAULT_MEMORY_MB
    type: int
    default: "0"
    scope: startup
    default_doc: Unset requests 16384 MiB (16 GiB).
    doc: >
      Memory in MiB a container build requests when the caller does not
      say. Ignored with a report when it is not a non-negative whole
      number, as above.

  - name: HTTP_API_BUILD_DEFAULT_DISK_MB
    type: int
    default: "0"
    scope: startup
    default_doc: Unset requests 30720 MiB (30 GiB).
    doc: >
      Disk in MiB a container build requests when the caller does not
      say. Ignored with a report when it is not a non-negative whole
      number, as above.

  - name: HTTP_API_BUILD_MAX_CPUS
    type: int
    default: "0"
    scope: startup
    default_doc: Unset leaves CPUs uncapped.
    doc: >
      Most CPUs one container build may request; a larger request is
      clamped to it rather than refused. Worth setting, because build
      slots are large -- CHTC's are 128-core, 256 GB machines -- and an
      agent asking for plenty should not be able to claim a whole one.

  - name: HTTP_API_BUILD_MAX_MEMORY_MB
    type: int
    default: "0"
    scope: startup
    default_doc: Unset leaves memory uncapped.
    doc: >
      Most memory in MiB one container build may request, clamped
      rather than refused, for the reason above.

  - name: HTTP_API_BUILD_MAX_DISK_MB
    type: int
    default: "0"
    scope: startup
    default_doc: Unset leaves disk uncapped.
    doc: >
      Most disk in MiB one container build may request, clamped rather
      than refused, for the reason above.


  # Submit-file policy and the idempotency-key guarantee. All read once
  # at startup.
  - name: HTTP_API_SUBMIT_FILE_DEFAULTS
    type: string
    default: ""
    scope: startup
    doc: >
      Submit-file lines added to every submission, but only where the
      submit file is silent, so a user who sets the same command keeps
      their own value. Written as HTCondor configuration, so several
      lines need that syntax for a multi-line value. Operator-only
      configuration, spliced in as written.

  - name: HTTP_API_SUBMIT_FILE_OVERRIDES
    type: string
    default: ""
    scope: startup
    doc: >
      Submit-file lines added to every submission that win over
      whatever the submit file says. For requirements that are not the
      user's to opt out of -- an access point that will not have a log
      written outside the home directory, say. Otherwise as above:
      HTCondor configuration syntax, operator-only, spliced in as
      written.

  - name: HTTP_API_IDEMPOTENCY_KEY_CHECK
    type: string
    default: ""
    scope: startup
    default_doc: Unset is AUTO.
    doc: >
      How much of the idempotency-key guarantee this access point
      enforces. NONE does not check at all; QUEUE checks the live job
      queue; FULL checks the queue and the mirrored history, which is
      what makes a key reused after its job finished still a duplicate;
      AUTO is FULL where an htcondordb mirror is configured and QUEUE
      where none is. OFF and FALSE read as NONE, TRUE as FULL. Anything
      else is reported and AUTO applies.

  - name: HTTP_API_IDEMPOTENCY_KEY_RETENTION
    type: int
    default: "0"
    scope: startup
    default_doc: Unset keeps a key claimed for one hour.
    doc: >
      How long, in whole seconds, a key this server submitted stays
      claimed in memory. It covers the window in which a finished job is
      in neither the live queue nor the mirrored history yet, so it
      wants to be longer than the gap between the schedd writing a job
      out and the mirror carrying it. A value that is not a
      non-negative whole number is reported and the default applies.

  - name: HTTP_API_IDEMPOTENCY_KEY_TIMEOUT
    type: int
    default: "0"
    scope: startup
    default_doc: Unset bounds the lookups at 10 seconds.
    doc: >
      How long, in whole seconds, the queue and history lookups get
      between them. A keyed submission waits on them, so this is also
      the longest the check can delay one. Reported and defaulted the
      same way as above when it is not a non-negative whole number.

  - name: HTTP_API_IDEMPOTENCY_KEY_HISTORY_WINDOW
    type: int
    default: "0"
    scope: startup
    default_doc: Unset consults the whole history.
    doc: >
      How far back, in whole seconds, the history lookup reads, as a
      floor on EnteredHistoryTime. It trades the guarantee for the cost
      of the read: a key reused after the window reads as unused. Unset
      consults the whole history, which is what the index is there for,
      so set this only where that read is measurably too expensive.


  # The last of the settings the server read and no page documented.
  - name: HTTP_API_LOG
    type: string
    default: ""
    scope: startup
    default_doc: Unset logs to stdout.
    doc: >
      Where this daemon writes its log: a file, or the words stdout or
      stderr. A named file that cannot be written falls back to stdout
      with a message -- except under condor_master, where stdout is
      discarded and there would be nowhere to report anything, so the
      daemon refuses to start and the reason goes to the master's log
      instead.

  - name: HTTP_API_JOB_QUEUE_LOG
    type: string
    default: ""
    scope: startup
    default_doc: Unset uses JOB_QUEUE_LOG when that file is actually present.
    doc: >
      The schedd's job queue log, tailed to serve the job change
      stream, or the word none to switch the stream off. Unset falls
      back to JOB_QUEUE_LOG where the file is there, which is the case
      when this server shares a host with its schedd; where it does not
      -- an API server in its own container, the usual deployment --
      there is nothing to tail and that is not a misconfiguration.
      Named explicitly and absent is an operator error, and is reported
      as one.

  - name: HTTP_API_JUPYTER_WORK_DIR
    type: string
    default: ""
    scope: startup
    default_doc: Unset uses a directory under the system temporary directory.
    doc: >
      Where the helper binary and token files for JupyterLab
      submissions are staged. The helper itself is built into this
      binary, so nothing has to be found on disk; this is only where it
      is written out to be transferred.

  - name: HTTP_API_MCP_BASE_URL
    type: string
    default: ""
    scope: startup
    doc: >
      The externally-visible base URL of the MCP listener, for a
      deployment that serves MCP on an address of its own. Unset, MCP
      is reached at HTTP_API_BASE_URL like everything else.

  - name: HTTP_API_MCP_LISTEN_ADDR
    type: string
    default: ""
    scope: startup
    doc: >
      A second address to serve MCP on, separate from
      HTTP_API_LISTEN_ADDR. Unset serves MCP on the one listener, which
      is what almost every deployment wants; this is for separating the
      agent surface onto its own port or interface.

  - name: HTTP_API_PING_INTERVAL
    type: duration
    default: 1m
    scope: startup
    doc: >
      How often the daemon pings the pool to decide what /readyz
      reports, as a duration with a unit. A bare 0 switches the ping
      off and is the one value exempt from the unit rule, since there
      is no ambiguity in zero. Switching it off is what a deployment
      holding no local HTCondor credential needs: where every request
      authenticates with a forwarded token and the daemon itself has
      nothing to ping with, the ping can only fail and drag /readyz
      down with it. A value with no unit, or one that does not parse,
      refuses to start rather than being guessed at -- 5 could be
      seconds or minutes.

  - name: HTTP_API_CONNECTOR_OUTPUT_SWEEP_INTERVAL
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset leaves the sweep off.
    doc: >
      How often finished jobs are swept for output to deliver to a
      connected account, as a duration with a unit. A bare number is
      refused rather than guessed at, and anything under a minute is
      raised to one with a message: sweeping faster asks the queue and
      the provider about the same finished jobs more often than they
      can change, and a provider's rate limit is a real consequence.
      Read at startup; the running ticker does not re-read it, so a
      change needs a restart even though the rest of the connector
      configuration reloads.

  - name: HTTP_API_CONNECTOR_PREFIX
    type: string
    default: webapi
    scope: startup
    doc: >
      The prefix of the credd service names this server stores
      connected-account credentials under. Change it only to keep two
      servers sharing one credd from seeing each other's credentials.

  - name: HTTP_API_INTERACTIVE_EXTRA_SUBMIT
    type: string
    default: ""
    scope: startup
    doc: >
      Extra submit-file lines added to every interactive session job --
      terminal, VS Code and JupyterLab. Operator-only configuration,
      spliced in as written, as with the submit-file settings above.


  - name: HTTP_API_SPOOL_MAX_UPLOAD_BYTES
    type: bytes
    default: "0"
    scope: startup
    default_doc: Unset caps one upload at 1000 MiB.
    doc: >
      The most bytes one upload command may transfer: a PUT or POST to
      a job's input, a redeemed upload URL, or an upload_job_input tool
      call. A cluster-wide upload counts the archive once per proc it
      serves, so a 10 MiB archive spooled to 50 procs is 500 MiB
      against this and not 10. Written as a byte count or a size --
      1000M, 2G, 1000MiB all work, and units are powers of 1024. A
      cluster-wide call that cannot fit spools what it can and reports
      the remainder, so the limit costs an extra call rather than
      failing; a single-proc upload over it is refused. A value that is
      zero, negative or unreadable is reported and the default applies:
      the cap can be raised but not turned off, because reading a typo
      as "no ceiling" would turn one bad line into an unbounded
      fan-out, which is the thing the limit is for.


  # The SSH gateway: where it listens, what it signs with, and the
  # fail2ban-style lockout on its public port. All read once at startup.
  - name: HTTP_API_SSH_GATEWAY_ADDRESS
    type: string
    default: ""
    scope: startup
    doc: >
      Where the SSH gateway listens, e.g. :2222. Unset disables the
      gateway entirely.
    see:
      - text: The SSH gateway
        url: ssh-gateway.md

  - name: HTTP_API_SSH_GATEWAY_ISSUER
    type: string
    default: ""
    scope: startup
    doc: >
      The OAuth2 issuer the gateway's device flow runs against. Unset
      uses this server's own issuer; set it where this process cannot
      reach its own public URL. A login that fails with "could not
      start the login flow" is usually this, left pointing at the
      default http://localhost:8080.

  - name: HTTP_API_SSH_HOST_KEY_FILE
    type: string
    default: ""
    scope: startup
    secret: true
    doc: >
      The host key clients pin. Unset, one is generated and kept sealed
      in the application database, which is what most deployments want.

  - name: HTTP_API_SSH_CA_KEY_FILE
    type: string
    default: ""
    scope: startup
    secret: true
    doc: >
      The CA key user certificates are signed with. Unset, one is
      generated and sealed as above. Without a CA key certificates are
      simply unavailable and the device flow still works.

  - name: HTTP_API_SSH_GATEWAY_HOST
    type: string
    default: ""
    scope: startup
    doc: >
      The name or names users actually ssh to, e.g. ap.example.edu,
      separated by commas. It is what the web interface prints as the
      ssh command, and also what the host certificate and the published
      known_hosts line are narrowed to, so list every name and alias in
      use. It cannot be derived: the listen address is usually not what
      anybody types, since a container listening on :2222 sits behind a
      service publishing 22 somewhere else. Unset prints no command and
      falls host verification back to a wildcard pattern.

  - name: HTTP_API_SSH_GATEWAY_LOCKOUT_THRESHOLD
    type: int
    default: "0"
    scope: startup
    default_doc: Unset allows 10 failed logins from one host.
    doc: >
      How many failed logins one host may accumulate inside the window
      before new connections from it are refused.
    see:
      - text: Locking out what keeps knocking
        url: ssh-gateway.md#locking-out-what-keeps-knocking

  - name: HTTP_API_SSH_GATEWAY_LOCKOUT_NET_THRESHOLD
    type: int
    default: "0"
    scope: startup
    default_doc: Unset allows four times the host threshold.
    doc: >
      The same budget for the network around a host, shared by every
      address in it, so a spray across a handful of addresses is caught
      where each one alone would not be.

  - name: HTTP_API_SSH_GATEWAY_LOCKOUT_WINDOW
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset remembers a failure for 10 minutes.
    doc: >
      How long a failed login is remembered against its source. Needs a
      unit, and a value without one refuses to start rather than being
      guessed at.

  - name: HTTP_API_SSH_GATEWAY_LOCKOUT_TIME
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset locks out for 15 minutes the first time.
    doc: >
      How long the first lockout of a source lasts. Each subsequent one
      doubles. Needs a unit, as above.

  - name: HTTP_API_SSH_GATEWAY_LOCKOUT_MAX_TIME
    type: duration
    default: 0s
    scope: startup
    default_doc: Unset stops the doubling at 24 hours.
    doc: >
      Where the doubling stops. Needs a unit, as above.

  - name: HTTP_API_SSH_GATEWAY_LOCKOUT_TRUSTED
    type: string
    default: ""
    scope: startup
    doc: >
      Addresses and CIDR blocks that are never counted and never locked
      out, separated by commas or spaces or both. Put the office and
      the monitoring host here so that testing the gateway cannot lock
      you out of it, and put a load balancer here if one fronts the
      port -- otherwise every client behind it shares one source
      address and one budget. A value that does not parse refuses to
      start rather than being ignored: the setting exists so an
      operator cannot be shut out of their own gateway, and passing
      over a typo in it would leave them believing they are safe.
    see:
      - text: Behind a load balancer
        url: ssh-gateway.md#behind-a-load-balancer

  - name: HTTP_API_SSH_GATEWAY_LOCKOUT_DISABLE
    type: bool
    default: "false"
    scope: startup
    doc: >
      Turn the lockout off. Written true, t, 1, yes or on -- the last
      two are accepted here although HTCondor configuration does not
      take them generally, because this setting always has. It is on by
      default, because the gateway
      listens on a public SSH port where unauthenticated traffic from
      people who are not users is the background noise rather than an
      exception, and a default of counting nothing would mean nobody
      gets the protection unless they went looking for it.

  - name: HTTP_API_SSH_GATEWAY_SESSION_CPUS
    type: int
    default: "0"
    scope: startup
    default_doc: Unset requests 1 CPU.
    doc: >
      CPUs requested by a session the gateway creates on demand, for a
      caller who connected by name rather than to a job they already
      have.

  - name: HTTP_API_SSH_GATEWAY_SESSION_MEMORY_MB
    type: int
    default: "0"
    scope: startup
    default_doc: Unset requests 1024 MiB.
    doc: >
      Memory in MiB for the same session.

  - name: HTTP_API_SSH_GATEWAY_SESSION_DISK_MB
    type: int
    default: "0"
    scope: startup
    default_doc: Unset requests 8192 MiB.
    doc: >
      Disk in MiB for the same session. The default is 8 GiB rather
      than something batch-sized because a VS Code Remote server
      installs itself into the sandbox and dies unpacking it in less --
      as a kernel out-of-space error deep in a client log, not as
      anything HTCondor reports.

  # The +jobs sandbox cache, configured on the same page.
  - name: HTTP_API_SANDBOX_CACHE_DIR
    type: string
    default: ""
    scope: startup
    doc: >
      Where the +jobs file service keeps sandbox output it has already
      fetched. Unset means no cache and every read fetches the sandbox
      again. It has to be real local storage with room for the budget
      below: on tmpfs the cache is memory the kernel cannot reclaim.
      Its contents are discarded at every start and may be deleted by
      hand while the server runs.

  - name: HTTP_API_SANDBOX_CACHE_MB
    type: int
    default: "0"
    scope: startup
    default_doc: Unset budgets the cache at 4096 MiB.
    doc: >
      That cache's budget in MiB. A negative number disables the cache.
      A value that is not a whole number refuses to start.

  - name: HTTP_API_SANDBOX_MAX_GB
    type: int
    default: "0"
    scope: startup
    default_doc: Unset serves a sandbox up to 8 GiB.
    doc: >
      The largest job sandbox the +jobs file service will serve, in
      GiB. A negative number means no limit. Refused the same way as
      above when it is not a whole number.


# Families: one group of parameters per named instance, with the name
# folded into the middle of the parameter. The generator emits a
# constructor taking the instance name and one accessor per setting, so
# the template lives here and nothing spells a parameter name by hand.
#
#   family        the Go constructor's name
#   prefix        what comes before the folded instance name
#   enumerated_by the list parameter naming the instances that exist
#   enumerated_doc that parameter's own paragraph, required with it --
#                 repeating the family's would print the same prose
#                 twice, side by side, in the reference
#   settings      as above, with name the suffix after the instance
families:
  - family: Picker
    prefix: HTTP_API_PICKER_
    enumerated_by: HTTP_API_PICKERS
    # SetConnectorConfig replaces the whole source from a freshly
    # loaded configuration on every reconfigure, so every setting
    # below is installed by one -- not just the parameter that names
    # the instances.
    enumerated_scope: reconfig
    enumerated_doc: >
      Names the file choosers this access point offers. Each is then
      configured by the HTTP_API_PICKER_<instance>_* settings.
    doc: >
      A file chooser the submit page offers, so a user can pick input
      files out of a connected account instead of uploading them.
      HTTP_API_PICKERS names the choosers that exist; a chooser is
      configured by the settings below with its name folded in, e.g.
      HTTP_API_PICKER_LAB_A_API_KEY for the chooser named lab-a.
    settings:
      - name: PROVIDER
        type: string
        default: ""
        scope: reconfig
        doc: >
          Which shipped chooser to run. Defaults to the chooser's own
          name, so the common case needs one line.
      - name: CONNECTOR
        type: string
        default: ""
        scope: reconfig
        doc: >
          The connector whose credential the chooser shows files with.
          Without one the chooser is not offered.
      - name: API_KEY
        type: string
        default: ""
        scope: reconfig
        secret: true
        doc: >
          The provider's developer key, where its chooser needs one to
          run in the browser.
      - name: APP_ID
        type: string
        default: ""
        scope: reconfig
        doc: >
          The provider's application id, where its chooser needs one
          alongside the developer key.
      - name: ORIGIN
        type: string
        default: ""
        scope: reconfig
        doc: >
          The origin the chooser is loaded from, when it is not the
          provider's default.

  - family: Connector
    prefix: HTTP_API_CONNECTOR_
    enumerated_by: HTTP_API_CONNECTORS
    # As above: a reconfigure rebuilds every definition, so each
    # setting below is installed by one.
    enumerated_scope: reconfig
    enumerated_doc: >
      Names the external accounts this access point offers to connect.
      Each is then configured by the
      HTTP_API_CONNECTOR_<instance>_* settings.
    doc: >
      An external account users may connect, so a job can read their
      files from it. HTTP_API_CONNECTORS names the connectors offered;
      each is configured by the settings below with its id folded in,
      e.g. HTTP_API_CONNECTOR_BUILTIN_GDRIVE_GROUPS for builtin:gdrive.
    settings:
      - name: KIND
        type: string
        default: ""
        scope: reconfig
        doc: >
          Which shipped connector definition to use, for an id that is
          not itself one.
      - name: CLIENT_ID
        type: string
        default: ""
        scope: reconfig
        doc: The OAuth2 client id this access point registered with the provider.
      - name: CLIENT_SECRET_FILE
        type: string
        default: ""
        scope: reconfig
        secret: true
        doc: >
          File holding the OAuth2 client secret. A connector with no
          readable secret is refused rather than offered.
      - name: AUTHORIZATION_URL
        type: string
        default: ""
        scope: reconfig
        doc: The provider's authorization endpoint, for a connector that is not a shipped one.
      - name: TOKEN_URL
        type: string
        default: ""
        scope: reconfig
        doc: The provider's token endpoint, for a connector that is not a shipped one.
      - name: SCOPES
        type: list
        default: ""
        scope: reconfig
        doc: The scopes requested when a user connects this account.
      - name: GROUPS
        type: list
        default: ""
        scope: reconfig
        doc: >
          Group(s) whose members may connect this account. Unset offers
          it to everyone who may sign in.
      - name: TRANSFER
        type: string
        default: ""
        scope: reconfig
        doc: How a job fetches from this account, where the connector supports more than one way.
      - name: ENABLED
        type: bool
        default: "true"
        scope: reconfig
        doc: >
          Whether the connector is offered at all. Default true, so a
          connector is turned off by setting this rather than by
          removing its configuration.

  - family: SiteApp
    prefix: HTTP_API_SITE_APP_
    # The bundles in HTTP_API_SITE_APPS_DIR are the instances; there is
    # no parameter listing them, and inventing one would put a setting
    # in the reference that nothing reads.
    enumerated_by_dir: true
    doc: >
      A lab's own web interface, published to the people it belongs to.
      Each bundle in HTTP_API_SITE_APPS_DIR is configured by the
      settings below with its id folded in, e.g.
      HTTP_API_SITE_APP_CRYOEM_GROUPS for the bundle cryoem. GROUPS is
      what declares an app: a bundle nobody has given groups to is not
      published.
    settings:
      - name: GROUPS
        type: list
        default: ""
        scope: reconfig
        doc: >
          Group(s) whose members this app is published to. An app with
          none is not published at all -- an empty value is far more
          often a mistake than a deliberate "nobody".
      - name: HOME
        type: bool
        default: "false"
        scope: reconfig
        doc: Whether this app is what its people land on instead of the dashboard.
      - name: ENABLED
        type: bool
        default: "true"
        scope: reconfig
        doc: >
          Whether the app is served. Default true when the setting is
          present at all, so an app is turned off by setting this to
          false rather than by removing its groups.
      - name: NAME
        type: string
        default: ""
        scope: reconfig
        doc: What the app is called in the navigation, instead of its bundle id.
      - name: DESCRIPTION
        type: string
        default: ""
        scope: reconfig
        doc: One line about the app, shown beside its name.
      - name: ICON
        type: string
        default: ""
        scope: reconfig
        doc: The icon shown beside the app's name.
