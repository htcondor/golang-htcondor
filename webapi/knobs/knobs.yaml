# Settings the HTCondor API server reads.
#
# This file is the source. knobs_gen.go is generated from it by
# `make knobs`, and a setting the server reads has to be here, because
# config.Get only accepts a declared knob -- there is no way to spell a
# name that this file does not carry.
#
# Fields:
#   name     the configuration parameter, HTTP_API_*
#   type     string | bool | duration | bytes | list
#   default  what applies when the setting is absent
#   scope    startup (a change needs a restart) | reconfig (a
#            reconfigure installs it on the running server)
#   doc      one paragraph, written for an operator; this is what the
#            configuration reference prints
#
# Migration in progress: most settings are still read as strings
# elsewhere. See design_notes/DOCUMENTATION_SITE.md.

knobs:
  - name: HTTP_API_TLS_CERT
    type: string
    default: ""
    scope: reconfig
    doc: >
      PEM certificate for serving HTTPS directly, rather than behind a
      terminating proxy. Needs HTTP_API_TLS_KEY; neither alone enables
      TLS.

  - name: HTTP_API_TLS_KEY
    type: string
    default: ""
    scope: reconfig
    doc: >
      Private key for HTTP_API_TLS_CERT. Keep it readable only by the
      account the server runs as.

  - name: HTTP_API_TLS_CA_CERT
    type: string
    default: ""
    scope: reconfig
    doc: >
      CA bundle used to verify client certificates. Unset asks for no
      client certificate.

  - name: HTTP_API_READ_TIMEOUT
    type: duration
    default: 30s
    scope: startup
    doc: >
      How long a request may take to arrive in full, as a Go duration.
      A value that cannot be parsed is logged and the default applies.

  - name: HTTP_API_WRITE_TIMEOUT
    type: duration
    default: 30s
    scope: startup
    doc: >
      How long a response may take to write, as a Go duration. This
      bounds a slow client, so it also bounds a deliberately long poll;
      see the note on streaming endpoints before lowering it.

  - name: HTTP_API_IDLE_TIMEOUT
    type: duration
    default: 120s
    scope: startup
    doc: >
      How long a keep-alive connection may sit idle before the server
      closes it, as a Go duration.

  - name: HTTP_API_OAUTH2_ISSUER
    type: string
    default: ""
    scope: startup
    doc: >
      The issuer this server names in its own OAuth2 documents. Unset,
      it is derived from the externally-visible URL, assuming https.

  - name: HTTP_API_OAUTH2_IDP
    type: string
    default: ""
    scope: startup
    doc: >
      An external identity provider to sign users in through, as the
      base URL of its OIDC discovery document. Discovery supplies the
      authorization, token and userinfo endpoints; the explicit
      HTTP_API_OAUTH2_*_URL settings are the fallback when it fails,
      which is logged as a warning rather than refused.

  - name: HTTP_API_OAUTH2_CLIENT_ID
    type: string
    default: ""
    scope: startup
    doc: The client id this server registered with that identity provider.

  - name: HTTP_API_OAUTH2_CLIENT_SECRET_FILE
    type: string
    default: ""
    scope: startup
    secret: true
    doc: >
      File holding the client secret for that registration. Read as
      root where the ordinary read is denied, since a secret staged on
      an access point is usually root-owned and this daemon has dropped
      privilege by then. An unreadable file is a warning and no secret,
      not a refusal to start.

  - name: HTTP_API_OAUTH2_AUTH_URL
    type: string
    default: ""
    scope: startup
    doc: >
      The provider's authorization endpoint, used when discovery is not
      configured or did not answer.

  - name: HTTP_API_OAUTH2_TOKEN_URL
    type: string
    default: ""
    scope: startup
    doc: >
      The provider's token endpoint, used when discovery is not
      configured or did not answer.

  - name: HTTP_API_OAUTH2_USERINFO_URL
    type: string
    default: ""
    scope: startup
    doc: >
      The provider's userinfo endpoint, used when discovery is not
      configured or did not answer.

  - name: HTTP_API_OAUTH2_REDIRECT_URL
    type: string
    default: ""
    scope: startup
    doc: >
      Where the provider sends the user back to. Unset, it is the
      issuer followed by this server's callback path, which is the
      right answer whenever the issuer is how users reach it.

  - name: HTTP_API_OAUTH2_SCOPES
    type: words
    default: ""
    scope: startup
    doc: >
      Scopes requested at sign-in, space separated as RFC 6749 writes
      them, e.g. "openid profile email org.cilogon.userinfo". Unset
      uses the built-in defaults.

  - name: HTTP_API_OAUTH2_GROUPS_CLAIM
    type: string
    default: groups
    scope: startup
    doc: >
      Which claim in the token carries the user's groups, for the
      settings that gate access on group membership.

  - name: HTTP_API_OAUTH2_USERNAME_CLAIM
    type: string
    default: ""
    scope: startup
    doc: >
      Which claim names the account that owns the jobs, where the
      provider's subject is not it.

  - name: HTTP_API_OAUTH2_REQUIREMENTS
    type: string
    default: ""
    scope: startup
    doc: >
      Login policy as a ClassAd expression over the token's claims. It
      is parsed at startup and a malformed one stops the server, rather
      than failing at somebody's first login.

  - name: HTTP_API_OAUTH2_DB_PATH
    type: string
    default: ""
    scope: startup
    doc: >
      Deprecated and ignored. The application database is
      HTTP_API_DB_PATH; the legacy oauth.db schema conflicts with the
      unified migration, so setting this is reported and has no effect.


  - name: HTTP_API_SPOOL_BUFFER_DIR
    type: string
    default: ""
    scope: startup
    doc: >
      Where an archive dropped in the SSH gateway's /submit/, or posted
      to the REST upload endpoints, is buffered while it is unpacked.
      Unset holds it in memory instead, under a much smaller ceiling.


# Families: one group of parameters per named instance, with the name
# folded into the middle of the parameter. The generator emits a
# constructor taking the instance name and one accessor per setting, so
# the template lives here and nothing spells a parameter name by hand.
#
#   family        the Go constructor's name
#   prefix        what comes before the folded instance name
#   enumerated_by the list parameter naming the instances that exist
#   settings      as above, with name the suffix after the instance
families:
  - family: Picker
    prefix: HTTP_API_PICKER_
    enumerated_by: HTTP_API_PICKERS
    doc: >
      A file chooser the submit page offers, so a user can pick input
      files out of a connected account instead of uploading them.
      HTTP_API_PICKERS names the choosers that exist; a chooser is
      configured by the settings below with its name folded in, e.g.
      HTTP_API_PICKER_LAB_A_API_KEY for the chooser named lab-a.
    settings:
      - name: PROVIDER
        type: string
        default: ""
        scope: startup
        doc: >
          Which shipped chooser to run. Defaults to the chooser's own
          name, so the common case needs one line.
      - name: CONNECTOR
        type: string
        default: ""
        scope: startup
        doc: >
          The connector whose credential the chooser shows files with.
          Without one the chooser is not offered.
      - name: API_KEY
        type: string
        default: ""
        scope: startup
        secret: true
        doc: >
          The provider's developer key, where its chooser needs one to
          run in the browser.
      - name: APP_ID
        type: string
        default: ""
        scope: startup
        doc: >
          The provider's application id, where its chooser needs one
          alongside the developer key.
      - name: ORIGIN
        type: string
        default: ""
        scope: startup
        doc: >
          The origin the chooser is loaded from, when it is not the
          provider's default.

  - family: Connector
    prefix: HTTP_API_CONNECTOR_
    enumerated_by: HTTP_API_CONNECTORS
    doc: >
      An external account users may connect, so a job can read their
      files from it. HTTP_API_CONNECTORS names the connectors offered;
      each is configured by the settings below with its id folded in,
      e.g. HTTP_API_CONNECTOR_BUILTIN_GDRIVE_GROUPS for builtin:gdrive.
    settings:
      - name: KIND
        type: string
        default: ""
        scope: startup
        doc: >
          Which shipped connector definition to use, for an id that is
          not itself one.
      - name: CLIENT_ID
        type: string
        default: ""
        scope: startup
        doc: The OAuth2 client id this access point registered with the provider.
      - name: CLIENT_SECRET_FILE
        type: string
        default: ""
        scope: startup
        secret: true
        doc: >
          File holding the OAuth2 client secret. A connector with no
          readable secret is refused rather than offered.
      - name: AUTHORIZATION_URL
        type: string
        default: ""
        scope: startup
        doc: The provider's authorization endpoint, for a connector that is not a shipped one.
      - name: TOKEN_URL
        type: string
        default: ""
        scope: startup
        doc: The provider's token endpoint, for a connector that is not a shipped one.
      - name: SCOPES
        type: list
        default: ""
        scope: startup
        doc: The scopes requested when a user connects this account.
      - name: GROUPS
        type: list
        default: ""
        scope: startup
        doc: >
          Group(s) whose members may connect this account. Unset offers
          it to everyone who may sign in.
      - name: TRANSFER
        type: string
        default: ""
        scope: startup
        doc: How a job fetches from this account, where the connector supports more than one way.
      - name: ENABLED
        type: bool
        default: "true"
        scope: startup
        doc: >
          Whether the connector is offered at all. Default true, so a
          connector is turned off by setting this rather than by
          removing its configuration.

  - family: SiteApp
    prefix: HTTP_API_SITE_APP_
    # The bundles in HTTP_API_SITE_APPS_DIR are the instances; there is
    # no parameter listing them, and inventing one would put a setting
    # in the reference that nothing reads.
    enumerated_by_dir: true
    doc: >
      A lab's own web interface, published to the people it belongs to.
      Each bundle in HTTP_API_SITE_APPS_DIR is configured by the
      settings below with its id folded in, e.g.
      HTTP_API_SITE_APP_CRYOEM_GROUPS for the bundle cryoem. GROUPS is
      what declares an app: a bundle nobody has given groups to is not
      published.
    settings:
      - name: GROUPS
        type: list
        default: ""
        scope: reconfig
        doc: >
          Group(s) whose members this app is published to. An app with
          none is not published at all -- an empty value is far more
          often a mistake than a deliberate "nobody".
      - name: HOME
        type: bool
        default: "false"
        scope: reconfig
        doc: Whether this app is what its people land on instead of the dashboard.
      - name: ENABLED
        type: bool
        default: "true"
        scope: reconfig
        doc: >
          Whether the app is served. Default true when the setting is
          present at all, so an app is turned off by setting this to
          false rather than by removing its groups.
      - name: NAME
        type: string
        default: ""
        scope: reconfig
        doc: What the app is called in the navigation, instead of its bundle id.
      - name: DESCRIPTION
        type: string
        default: ""
        scope: reconfig
        doc: One line about the app, shown beside its name.
      - name: ICON
        type: string
        default: ""
        scope: reconfig
        doc: The icon shown beside the app's name.
